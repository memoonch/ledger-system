[package]
name = "alfazal-ledger"
version = "0.1.0"
description = "Offline customer ledgers for local shops"
authors = ["Shop Ledger"]
edition = "2021"

[lib]
name = "alfazal_ledger_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

serde_json = "1"


